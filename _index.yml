indexpage:
  title: NetApp Workload Factory 文档
  summary: 开始使用 NetApp Workload Factory，以便您可以充分利用云存储工作负载。设置完成后，您可以为工作负载创建、优化和管理存储系统，探索成本节约，使用内置的基础架构即代码助手实现跨平台自动化，并在
    Workload Factory 中管理工作负载。
  keywords: Workload Factory, fsx, account, credentials, users, permissions, log in,
    calculator, codebox
  lead: 开始使用 NetApp Workload Factory，以便在使用 Amazon FSx for NetApp ONTAP 和 OCI NetApp
    存储服务时充分利用您的工作负载。设置完成后，您可以为工作负载创建、优化和管理 FSx for ONTAP 文件系统，探索使用 FSx for ONTAP 节省的成本，使用内置的基础架构即代码助手实现跨平台自动化，并在
    Workload Factory 中管理您的工作负载。
